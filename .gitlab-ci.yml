workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - test
  - build

variables:
  GO_DIR: services/rate-limiter-go
  PY_DIR: services/rate-limiter-python
  TS_DIR: services/rate-limiter-typescript
  IMAGE: $CI_REGISTRY_IMAGE/rate-limiter

# ---------------------------------------------------------------------------
# validate
# ---------------------------------------------------------------------------

go:vet:
  stage: validate
  image: golang:1.27.3
  script:
    - cd "$GO_DIR"
    - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
    - go vet ./...

typescript:typecheck:
  stage: validate
  image: node:26.13.0
  script:
    - cd "$TS_DIR"
    - npm ci
    - npm run typecheck

manifests:validate:
  stage: validate
  image: alpine/k8s:1.37.2
  script:
    - helm lint infra/charts/rate-limiter
    - kustomize build --enable-helm infra/deployments/production > production.yaml
    - kubeconform -strict -summary -kubernetes-version 1.34.0 production.yaml
  artifacts:
    paths:
      - production.yaml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# test
#
# The limiter in each service is left for the candidate to implement, so these
# fail until it is. They are allowed to fail so the rest of the pipeline still
# reports.
# ---------------------------------------------------------------------------

go:test:
  stage: test
  image: golang:1.27.3
  allow_failure: true
  script:
    - cd "$GO_DIR"
    - go test -race ./...

python:test:
  stage: test
  image: python:3.13.18-slim
  allow_failure: true
  script:
    - pip install --quiet uv==0.13.7
    - cd "$PY_DIR"
    - uv run pytest

typescript:test:
  stage: test
  image: node:26.13.0
  allow_failure: true
  script:
    - cd "$TS_DIR"
    - npm test

# ---------------------------------------------------------------------------
# build
# ---------------------------------------------------------------------------

.docker:
  stage: build
  image: docker:29.9.3
  services:
    - docker:29.9.3-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"

docker:build:
  extends: .docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" "$GO_DIR"

docker:publish:
  extends: .docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" "$GO_DIR"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"
