{{- if .Values.rbac.create -}}
{{- $kind := ternary "ClusterRole" "Role" .Values.rbac.clusterWide -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}
metadata:
  name: {{ include "rate-limiter.fullname" . }}
  {{- if not .Values.rbac.clusterWide }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "rate-limiter.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}Binding
metadata:
  name: {{ include "rate-limiter.fullname" . }}
  {{- if not .Values.rbac.clusterWide }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "rate-limiter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $kind }}
  name: {{ include "rate-limiter.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rate-limiter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
