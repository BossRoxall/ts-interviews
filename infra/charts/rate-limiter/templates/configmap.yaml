apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rate-limiter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rate-limiter.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.containerPort | quote }}
  RATE_LIMIT_CAPACITY: {{ .Values.rateLimit.capacity | quote }}
  RATE_LIMIT_INTERVAL_SECONDS: {{ .Values.rateLimit.intervalSeconds | quote }}
  RATE_LIMIT_REFILL_AMOUNT: {{ .Values.rateLimit.refillAmount | quote }}
  RATE_LIMIT_REFILL_INTERVAL_SECONDS: {{ .Values.rateLimit.refillIntervalSeconds | quote }}
