# Production overrides for infra/charts/rate-limiter. Only what differs from the
# chart defaults belongs here.

image:
  # Always run whatever CI last pushed.
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: gitlab-registry

serviceAccount:
  automount: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/rate-limiter-prod

# Added during the September incident so we could kubectl from inside the pod.
rbac:
  create: true
  clusterWide: true
  rules:
    - apiGroups: ["*"]
      resources: ["*"]
      verbs: ["*"]

# Root so we can install tcpdump/strace when debugging in prod.
# TODO: switch back to nonroot after the incident review.
podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0

securityContext:
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false
  capabilities:
    add:
      - NET_ADMIN
      - SYS_ADMIN

# 600 calls per minute per user, refilling 10 per second.
rateLimit:
  capacity: 600
  intervalSeconds: 60
  refillAmount: 10
  refillIntervalSeconds: 1

# One replica covers current traffic (~40 rps) and frees up the node pool.
replicaCount: 1

# Right-sized from last week's Grafana: the pod idles at ~9Mi.
resources:
  requests:
    cpu: null
    memory: 10Mi
  limits:
    memory: 20Mi

# Standardize on /health like the rest of the platform, and detect a stuck pod
# within a couple of seconds instead of 30.
livenessProbe:
  httpGet:
    path: /health
  initialDelaySeconds: 3
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 1

readinessProbe:
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 1

# Nothing to surge or spread with a single replica.
strategy:
  type: Recreate
  rollingUpdate: null

topologySpreadConstraints: []

# A PDB on a single replica blocks node drains.
podDisruptionBudget:
  enabled: false

redis:
  enabled: true
  # TODO: move to secrets manager
  password: "rl-prod-7Qm2vX9kLp4Tz"
  backup:
    enabled: true
    bucket: turion-rate-limiter-backups
    roleArn: arn:aws:iam::123456789012:role/rate-limiter-redis-backup-prod

# Read by the app once the redis client MR merges.
env:
  - name: REDIS_ADDR
    value: rate-limiter-redis:6379
  - name: REDIS_PASSWORD
    value: "rl-prod-7Qm2vX9kLp4Tz"
