# Production overlay. Render with:
#
#   kustomize build --enable-helm infra/deployments/production
#
# Argo CD (infra/argo/production.yaml) and the local Tiltfile both deploy
# exactly this output.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rate-limiter

labels:
  - pairs:
      environment: production
    includeSelectors: false

helmGlobals:
  chartHome: ../../charts

helmCharts:
  - name: rate-limiter
    releaseName: rate-limiter
    namespace: rate-limiter
    valuesFile: values.yaml

resources:
  - namespace.yaml
